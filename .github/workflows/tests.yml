name: tests

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a newly published advisory for a pinned package shows up without a push.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" cryptography

      - name: Run tests
        run: python -m pytest -q

      - name: Build the package
        run: python -m build

  passport:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Installs from bun.lock (frozen) and bundles client.ts, so a broken lockfile or a
      # client that no longer compiles fails here.
      - name: Build the passport service
        run: docker build passport

  site-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build the site image from the pinned requirements
        run: docker build -f Dockerfile.site .

  # Known vulnerabilities in what the site and the passport service actually install.
  # The verifier fork is audited in its own repository (docs/VERIFIER-MAINTENANCE.md).
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Audit the site's pinned Python packages
        run: |
          python -m pip install pip-audit
          pip-audit --no-deps --disable-pip -r requirements-site.txt

      - name: Audit the passport service's packages
        run: >
          docker run --rm -v "$PWD/passport:/p:ro"
          oven/bun:1.3.8@sha256:371d30538b69303ced927bb5915697ac7e2fa8cb409ee332c66009de64de5aa3
          sh -c 'cp -r /p /w && cd /w && bun install --frozen-lockfile && bun audit'
