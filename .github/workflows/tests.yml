name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" cryptography

      - name: Run tests
        run: python -m pytest -q

      - name: Build the package
        run: python -m build

  passport:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Installs from bun.lock (frozen) and bundles client.ts, so a broken lockfile or a
      # client that no longer compiles fails here.
      - name: Build the passport service
        run: docker build passport

  site-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build the site image from the pinned requirements
        run: docker build -f Dockerfile.site .
