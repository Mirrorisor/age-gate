# Runs the verifier from our fork's published image (built by the fork's "Fork image"
# workflow on every push to main) instead of upstream's image.
# Use:  docker compose -f docker-compose.yml -f docker-compose.fork.yml up -d
# Update to the newest fork build:  docker compose -f docker-compose.yml -f docker-compose.fork.yml pull verifier
services:
  verifier:
    image: ghcr.io/mirrorisor/zk-age-verifier:fork
