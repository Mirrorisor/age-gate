# A Zcash TESTNET full node (Zebra). Testnet only: about 10 GB of disk.
#
#   docker compose -p zebra-node -f docker-compose.node.yml up -d
#   docker compose -p zebra-node -f docker-compose.node.yml logs --tail 5
#   docker compose -p zebra-node -f docker-compose.node.yml down      (keeps the downloaded data)
#   docker compose -p zebra-node -f docker-compose.node.yml down -v   (deletes the data too)

services:
  zebra:
    image: zfnd/zebra:7.0.0@sha256:a70d2be8ffef3a4b6e37355724e36a0e6c1838e46baa28bfb216739f00cf2d34
    restart: unless-stopped
    environment:
      ZEBRA_NETWORK__NETWORK: Testnet
    volumes:
      - zebra-testnet:/home/zebra/.cache/zebra

volumes:
  zebra-testnet:
