# default because upstream has not responded to its fixes (see README, "Which verifier").
# Use:  docker compose -f docker-compose.yml -f docker-compose.upstream.yml up -d
services:
  verifier:
    # Upstream 0.5.0, the build published 2026-11-15 (pinned 2026-11-19).
    image: ghcr.io/pipe23-org/zk-age-verifier:latest@sha256:89cd71a5f1a1210df6917ef1c697638bd931818d85fa820da4798d4ed435f212
