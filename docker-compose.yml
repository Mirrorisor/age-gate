# Runs the verifier and the demo site together. Local use only.
#
# First time:
#   1. Copy .env.example to .env and fill it in (see the comments there).
#   2. Stop any verifier you started by hand:  docker stop zkv
#   3. docker compose up --build
# Then open http://localhost:5000 (use localhost, not 127.0.0.1).
#
# To try the payment step with the fake checkout server (no wallet, no coins):
#   put PAYMENT_GATE=1 and the two fake keys from .env.example in .env, then run
#   docker compose --profile fakepay up --build
# and open http://127.0.0.1:8080/fake/ to "pay".

services:
  verifier:
    restart: unless-stopped
    # Our fork (https://github.com/Mirrorisor/zk-age-verifier): upstream plus the refused-
    # certificate log, the safer trust-list loader, --check-cert and the test clock fix.
    # Pinned to the build tested on 2026-10-30 (fork 623ce86). To update: docker pull
    # ghcr.io/mirrorisor/zk-age-verifier:fork, test it, then copy its digest here
    # (docker image inspect --format '{{index .RepoDigests 0}}' ...).
    # To compare with upstream's image, add -f docker-compose.upstream.yml.
    image: ghcr.io/mirrorisor/zk-age-verifier:fork@sha256:57a336057b231d7f474e6268bf473303bac29335e2fd286421265e0883942057
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${VERIFIER_CONFIG_DIR:-./verifier-config}:/config:ro
    environment:
      ZK_AGE_VERIFIER_CONFIG: /config/config.toml

  site:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.site
    depends_on:
      - verifier
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - sitedata:/data
    environment:
      VERIFIER_URL: http://verifier:8000
      SITE_ORIGIN: ${SITE_ORIGIN:-http://localhost:5000}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-30}
      INVOICE_RETENTION_DAYS: ${INVOICE_RETENTION_DAYS:-30}
      PASSPORT_URL: ${PASSPORT_URL:-}
      PASSPORT_DEV_MODE: ${PASSPORT_DEV_MODE:-1}
      SECRET_KEY: ${SECRET_KEY:?Create a .env file with SECRET_KEY (see .env.example)}
      PAYMENT_GATE: ${PAYMENT_GATE:-0}
      ZC_URL: ${ZC_URL:-http://fakepay:8080}
      ZC_API_KEY: ${ZC_API_KEY:-}
      ZC_WEBHOOK_SECRET: ${ZC_WEBHOOK_SECRET:-}
      PRICE_ZEC: ${PRICE_ZEC:-0.001}
      INVOICE_DB: /data/invoices.db
      # Passport checks already tried, so a restart cannot give a used one a second try.
      PASSPORT_SCOPES_DB: /data/passport-scopes.db
      # Rate-limit counts, shared by every worker process and kept across restarts.
      RATE_LIMIT_DB: /data/ratelimit.db

  # Optional: prove age with a passport through the ZKPassport app (see passport/README.md).
  # Only starts with:  --profile passport   and needs PASSPORT_URL=http://passport:8100 in .env
  # Not published on any port: only the site talks to it.
  passport:
    profiles: ["passport"]
    restart: unless-stopped
    build:
      context: ./passport
    environment:
      PASSPORT_DEV_MODE: ${PASSPORT_DEV_MODE:-1}
      PASSPORT_RPC_URL: ${PASSPORT_RPC_URL:-}

  # The standalone verification service, for a site in any language (docs/SERVICE.md).
  # Only starts with:  docker compose --profile service --profile passport up -d
  # Needs SERVICE_CALLBACK_URL and SERVICE_SECRET in .env (and the same secret on the site).
  agecheck-service:
    profiles: ["service"]
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.site
    command: ["gunicorn", "--bind", "0.0.0.0:8200", "--workers", "1", "--threads", "4",
              "agecheck.service:create_app()"]
    ports:
      - "127.0.0.1:8200:8200"
    volumes:
      - servicedata:/data
    environment:
      CALLBACK_URL: ${SERVICE_CALLBACK_URL:-}
      SERVICE_SECRET: ${SERVICE_SECRET:-}
      SERVICE_DOMAIN: ${SERVICE_DOMAIN:-localhost}
      PASSPORT_URL: ${SERVICE_PASSPORT_URL:-http://passport:8100}
      VERIFIER_URL: ${SERVICE_VERIFIER_URL:-}
      PASSPORT_DEV_MODE: ${PASSPORT_DEV_MODE:-1}
      SCOPES_DB: /data/scopes.db
      RATE_LIMIT_DB: /data/ratelimit.db
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
      TRUST_PROXY: ${TRUST_PROXY:-0}

  # A stand-in for ZecCheckout so the payment step can be tried with no wallet.
  # Only starts with:  docker compose --profile fakepay up --build
  fakepay:
    profiles: ["fakepay"]
    build:
      context: .
      dockerfile: Dockerfile.site
    command: ["python", "/scripts/fake_zeccheckout.py"]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./scripts:/scripts:ro
    environment:
      ZC_API_KEY: ${ZC_API_KEY:-}
      ZC_WEBHOOK_SECRET: ${ZC_WEBHOOK_SECRET:-}
      ZC_WEBHOOK_URL: http://site:5000/webhooks/zeccheckout
      FAKE_HOST: 0.0.0.0

  # The real ZecCheckout server, on the Zcash TESTNET. Start it with:
  #   docker compose --profile zec up --build
  # Do not run it together with the fakepay profile (both use port 8080).
  # Needs ZC_UFVK (a testnet viewing key, never a seed or spending key) in .env,
  # and ZC_URL=http://zeccheckout:10000 so the site talks to it.
  zeccheckout:
    restart: unless-stopped
    profiles: ["zec"]
    image: ghcr.io/samizdatproject/zeccheckout:latest@sha256:3945c75cb4b0eb43a52e2dab819a946e201eeec3ec4a14a2de4ee178790612e3
    platform: linux/amd64
    ports:
      - "127.0.0.1:8080:10000"
    volumes:
      - zecdata:/home/nonroot
    environment:
      ZC_NETWORK: testnet
      # Empty: the public testnet.zec.rocks. Set to our own node's lightwalletd (see
      # docker-compose.node.yml) to stop trusting a public server's view of the chain.
      ZC_LIGHTWALLETD: ${ZC_LIGHTWALLETD:-}
      ZC_UFVK: ${ZC_UFVK:-}
      ZC_API_KEY: ${ZC_API_KEY:-}
      ZC_WEBHOOK_SECRET: ${ZC_WEBHOOK_SECRET:-}
      ZC_WEBHOOK_URL: http://site:5000/webhooks/zeccheckout
      ZC_PUBLIC_URL: http://127.0.0.1:8080
      ZC_MIN_CONFIRMATIONS: "3"
      ZC_DB: /home/nonroot/zeccheckout.db

volumes:
  sitedata:
  servicedata:
  zecdata:
