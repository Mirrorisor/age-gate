[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agecheck-zk"
version = "0.1.0"
description = "Small client for the experimental zk-age-verifier service (zero-knowledge age checks)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest", "flask", "build"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]